name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # token not needed after clone; less leakage surface
      # Single gate at warning severity: scripts are clean at this level,
      # so warnings failing the build costs nothing and notices stay loud.
      # (Was: an error-level gate plus a second `|| true` style report —
      #  the `|| true` made findings structurally invisible; removed.)
      - name: shellcheck (warning-level gate)
        run: shellcheck -S warning scripts/*.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # token not needed after clone; less leakage surface
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: install
        run: pip install pytest
      - name: installer + config tests
        run: python -m pytest tests/ -q
